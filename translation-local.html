<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Local Translation Demo &middot; Sarvam-Translate</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --accent:#2563eb; --dim:#6b7280; --border:#e5e7eb; }
  * { box-sizing:border-box; }
  body { font-family:system-ui, -apple-system, sans-serif; background:#f9fafb; margin:0; padding:2rem; color:#111827; }
  .wrap { max-width:900px; margin:0 auto; }
  h1 { font-size:1.4rem; margin:0 0 0.3rem; }
  .server-row { display:flex; align-items:center; gap:0.6rem; margin-bottom:1.2rem; }
  .server-row label { font-size:0.8rem; color:var(--dim); }
  .server-row input { font-size:0.8rem; padding:0.3rem 0.5rem; border:1px solid var(--border); border-radius:6px; font-family:monospace; }
  #server-url { width:220px; }
  #model-id { width:220px; }
  #conn-status { font-size:0.8rem; }
  #conn-status.ok { color:#0d9488; }
  #conn-status.error { color:#dc2626; }

  .panes { display:flex; gap:1rem; margin-bottom:1rem; }
  .pane { flex:1; border:1px solid var(--border); border-radius:10px; background:white; padding:1rem; display:flex; flex-direction:column; }
  .pane select { font-size:0.85rem; padding:0.4rem; border:1px solid var(--border); border-radius:6px; margin-bottom:0.6rem; }
  .pane textarea, .pane #output { flex:1; min-height:220px; font-size:0.95rem; line-height:1.5; border:none; resize:none; outline:none; font-family:inherit; }
  #output { color:#111827; white-space:pre-wrap; }
  #output:empty::before { content:"Translation appears here..."; color:var(--dim); }

  .controls { display:flex; align-items:center; gap:1rem; }
  #translate-btn { padding:0.6rem 1.4rem; font-size:0.95rem; font-weight:600; background:var(--accent); color:white; border:none; border-radius:8px; cursor:pointer; }
  #translate-btn:disabled { opacity:0.5; cursor:not-allowed; }
  #status { font-size:0.85rem; color:var(--dim); }
</style>
</head>
<body>
<div class="wrap">
  <h1>Local Translation &middot; Sarvam-Translate via LM Studio</h1>
  <div class="server-row">
    <label>Server <input type="text" id="server-url" value="http://localhost:1234/v1/chat/completions"></label>
    <label>Model ID <input type="text" id="model-id" value="sarvam-translate"></label>
    <span id="conn-status">checking...</span>
  </div>

  <div class="panes">
    <div class="pane">
      <select id="source-lang">
        <option>English</option>
        <option>Hindi</option>
        <option>Spanish</option>
        <option>French</option>
        <option>German</option>
        <option>Japanese</option>
        <option>Chinese (Simplified)</option>
        <option>Arabic</option>
        <option>Portuguese</option>
        <option>Russian</option>
      </select>
      <textarea id="source-text" placeholder="Type or paste text to translate..."></textarea>
    </div>
    <div class="pane">
      <select id="target-lang">
        <option selected>Tamil</option>
        <option>Hindi</option>
        <option>English</option>
        <option>Spanish</option>
        <option>French</option>
        <option>German</option>
        <option>Japanese</option>
        <option>Chinese (Simplified)</option>
        <option>Arabic</option>
        <option>Portuguese</option>
        <option>Russian</option>
      </select>
      <div id="output"></div>
    </div>
  </div>
  <div class="controls">
    <button id="translate-btn">Translate</button>
    <span id="status"></span>
  </div>
</div>

<script type="module">
  const serverUrlEl = document.getElementById("server-url");
  const modelIdEl = document.getElementById("model-id");
  const connStatusEl = document.getElementById("conn-status");
  const sourceLangEl = document.getElementById("source-lang");
  const targetLangEl = document.getElementById("target-lang");
  const sourceTextEl = document.getElementById("source-text");
  const outputEl = document.getElementById("output");
  const translateBtn = document.getElementById("translate-btn");
  const statusEl = document.getElementById("status");

  // ponytail: LM Studio's local server must have "Enable CORS" turned on
  // (Developer tab -> server settings) or this fetch is blocked by the browser.
  async function checkConnection() {
    try {
      const base = new URL(serverUrlEl.value).origin;
      const res = await fetch(base + "/v1/models");
      if (!res.ok) throw new Error(res.status);
      connStatusEl.textContent = "LM Studio server reachable";
      connStatusEl.className = "ok";
    } catch {
      connStatusEl.textContent = "Can't reach LM Studio — start the server and enable CORS";
      connStatusEl.className = "error";
    }
  }
  checkConnection();

  async function translate() {
    const text = sourceTextEl.value.trim();
    if (!text) return;

    translateBtn.disabled = true;
    statusEl.textContent = "Translating...";
    outputEl.textContent = "";

    // ponytail: chat completions (not raw /v1/completions) so LM Studio applies
    // the model's own chat template + stop token — a hand-built raw prompt has
    // no turn-end marker and the model degenerates into repeating itself past
    // the real answer once it runs out of "translation" to produce.
    const messages = [
      {
        role: "system",
        content: `You are a translation engine. Translate the user's text from ${sourceLangEl.value} to ${targetLangEl.value}. Output ONLY the translated text — no explanations, no quotes, no notes.`
      },
      { role: "user", content: text }
    ];

    try {
      const res = await fetch(serverUrlEl.value, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: modelIdEl.value.trim(),
          messages,
          stream: true,
          temperature: 0.3,
          max_tokens: 512
        })
      });
      if (!res.ok || !res.body) throw new Error(`Server returned ${res.status}`);

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      let reply = "";

      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split("\n");
        buffer = lines.pop();

        for (const line of lines) {
          const trimmed = line.trim();
          if (!trimmed.startsWith("data:")) continue;
          const payload = trimmed.slice(5).trim();
          if (payload === "[DONE]") continue;
          try {
            const json = JSON.parse(payload);
            reply += json.choices?.[0]?.delta?.content || "";
            outputEl.textContent = reply;
          } catch {
            // ponytail: skip malformed SSE chunk, keep streaming
          }
        }
      }
    } catch (e) {
      outputEl.textContent = `Translation failed: ${e.message}`;
    }

    statusEl.textContent = "";
    translateBtn.disabled = false;
  }

  translateBtn.addEventListener("click", translate);
</script>
</body>
</html>
